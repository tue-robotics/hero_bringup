# classic | hybrid | vla. hybrid runs the classic find and approach, then the
# VLA grasp, with the classic Grab as fallback; vla is the same without the
# fallback (like strict_mode). action_server.launch overrides this from
# ACTION_SERVER_EXECUTION_MODE.
execution_mode: hybrid
provider: local
# The place/hand-over hooks run before the classic navigation to their target
# location, so only pick-up is handed to the VLA.
enabled_actions:
  - pick-up
output_mode: joints
action_dim: 11
# The policy server decides the checkpoint, its state indices and the action
# layout (POLICY_STATE_INDICES=0,1,2,3,4,5,6,7, POLICY_ACTION_LAYOUT=hsr11).
local_backend_class: action_server.vla.backends:SmolVLAWebSocketBackend

# Rate of the chunk rows, as in the reference AIRoA client (update_freq 10).
policy_fps: 10.0
# Rows of each 50-row chunk played before re-querying (10 rows = 1 s, like the
# reference client's adopted_action_chunks).
chunk_prefix_steps: 10
# Re-query budget: 60 chunks x 10 rows = 60 s of policy motion.
max_chunks: 60

# Port 8000 is taken by the tue_mobile_ui webserver of hero-start; the policy
# container is started with -p 8001:8000.
policy_url: ws://127.0.0.1:8001
policy_timeout: 30.0

# The VLA backend requires both the head and hand camera observations.
image_timeout: 5

# Joint-space pose [m, rad] the training episodes start from: arm in the HSR
# neutral pose (HERO's reset/carrying poses have arm_roll -1.57, far outside
# the training data) and the head tilted down at the table (training mean -0.61).
# The lift goes first so the arm clears the table edge. Use [] to keep a part.
start_arm_pose: [0.2, 0.0, 0.0, -1.57, 0.0]
start_head_pose: [0.0, -0.6]

# Arm columns are deltas w.r.t. the measured joints, streamed to the arm
# controller; the arm speed is about delta / arm_lead_time. The targets are
# bounded by the robot_description: the joint limits, and the velocity limit
# times arm_lead_time per row. The reference client uses 0.05 s; 0.2 s tracks
# the speed of the teleoperation data in the simulator.
arm_lead_time: 0.2

# Gripper column is the absolute hand_motor_joint position (~-0.8 closed,
# ~1.24 open). Like the reference client's 'hybrid' mode, below the close
# threshold the gripper grasps with effort, above it the column is followed as a
# position: the policy pre-shapes the hand to ~0.7 while approaching and drops
# below 0 when it grasps.
gripper_close_threshold: 0.5
# 0.26 * 0.07 m moment arm = the reference client's 0.018 Nm grasp effort.
gripper_max_torque: 0.26

# The head columns are deltas and nearly zero in the training data; the head is
# held at start_head_pose.
enable_head_motion: false
# Head reference speed (rad/s) used when actuating head_pan/head_tilt targets.
head_vel: 1.0

# The classic NavigateToGrasp puts the object within reach, so by default the
# VLA only moves the arm and gripper. Enable to let it correct with the base.
enable_base_motion: false
# Base(3) columns are body-frame velocities [m/s, m/s, rad/s], as in the
# reference client (/hsrb/command_velocity).
# Safety clamps: the velocity goes straight to the base controller, bypassing collision avoidance.
max_base_velocity: 0.2
max_base_yaw_velocity: 0.4

# Completion: an effort grasp older than grasp_settle_time is lifted by
# post_grasp_lift, then checked with the classic ActiveGraspDetector (squeeze,
# compare the finger positions). If nothing is held the gripper opens and the
# policy continues.
grasp_settle_time: 1.0
post_grasp_lift: 0.1
# SIM ONLY: hand_motor_joint below which the detector takes the hand as closed on
# nothing. The simulated fingers stall at -0.07..0.17 on nothing and at ~0.55 on
# an apple; the real HERO closes to about -0.8 (detector default -0.82). Remove
# for the real robot, and calibrate it in the sim (close on nothing, on the
# table edge and on an apple).
grasp_minimum_position: 0.3
